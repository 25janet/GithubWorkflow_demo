name: CI Pipeline

env:
    REGISTRY: docker.io
    IMAGE_NAME: janetjohn15/mypythonapp

on:
  push:
    branches: [ "master", "Feature-branch"]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automated tests
      run: |
        pytest
  
  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    steps: 
      - name: Checkout Repository code
        uses: actions/checkout@v4

      - name: Login to Docker
        uses: docker/login-action@v3
        with: 
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build  docker image
        run: |
            docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      
      - name: Push to docker registry
        run: |
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          script: |
            set -e

            echo "Connected to the Remote server"

            echo "Moving to project directory"
            cd /mnt/c/Users/user/Documents/github_workflow

            echo "Updating project files"
            git pull origin master

            echo "Checking Containerd"
            sudo containerd --version

            echo "Checking nerdctl Compose"
            sudo nerdctl --address /run/containerd/containerd.sock compose version

            echo "Pulling latest Docker image"
            sudo nerdctl --address /run/containerd/containerd.sock pull \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            echo "Starting application with Compose"
            sudo nerdctl --address /run/containerd/containerd.sock compose up -d

            echo "Checking containers"
            sudo nerdctl --address /run/containerd/containerd.sock ps -a

            echo "Showing application logs"
            sudo nerdctl --address /run/containerd/containerd.sock logs \
              github_workflow-mypythonapp-1