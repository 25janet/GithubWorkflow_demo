name: CI Pipeline

env:
    REGISTRY: docker.io
    IMAGE_NAME: janetjohn15/mypythonapp

on:
  push:
    branches: [ "master", "Feature-branch"]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automated tests
      run: |
        pytest
  
  build-push-pull:
    runs-on: ubuntu-latest
    needs: test

    steps: 
      - name: Checkout Repository code
        uses: actions/checkout@v4

      - name: Login to Docker
        uses: docker/login-action@v3
        with: 
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build  docker image
        run: |
            docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      
      - name: Push to docker registry
        run: |
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      
      - name: Pull from docker registry
        run: |
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker pull ${{ env.REGISTRY }}/nginx
      
      - name: Run a container
        run: | 
            docker run -d --name test1 -p 8080:80 ${{ env.REGISTRY }}/nginx
            docker run -d --name test2 -p 127.0.0.1:8081:500 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker ps 


      

