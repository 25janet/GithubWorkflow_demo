name: CI Pipeline

env:
    REGISTRY: docker.io
    IMAGE_NAME: janetjohn15/mypythonapp

on:
  push:
    branches: [ "master", "Feature-branch"]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automated tests
      run: |
        pytest
  
  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    steps: 
      - name: Checkout Repository code
        uses: actions/checkout@v4

      - name: Login to Docker
        uses: docker/login-action@v3
        with: 
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build  docker image
        run: |
            docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      
      - name: Push to docker registry
        run: |
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.3
        with: 
              host: ${{ secrets.SSH_HOST }}
              username: ${{ secrets.SSH_USERNAME }}
              key: ${{ secrets.SSH_PRIVATE_KEY}}
              port: 22
        script: | 
            echo "Connected to the Remote server"

            echo "Checking Containerd version"
            containerd --version

            echo "Checking nerdctl"
            nerdctl --version

            echo " Pulling an Image from the registry"
            nerdctl pull ${{ env.REGISTRY}}/{{ env.IMAGE_NAME }}:latest

            echo "Running a container using the pulled image"
            nerdctl run -d --name mypythonapp ${{ env.REGISTRY }}/{{ env.IMAGE_NAME }}:latest
          
            echo "Checking Running containers"
            nerdctl ps



      

